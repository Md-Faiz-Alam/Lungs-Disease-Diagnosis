name: CI

on:
  push:
    branches-ignore: [main] # main is tested by deploy.yml, which reuses this workflow as its gate
  pull_request:
  workflow_call: # reused by deploy.yml as its quality gate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (locked versions, CPU torch)
        run: |
          pip install --upgrade pip setuptools
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-lock.txt
          pip install -e ".[api,azure,export,dev]"
      - name: Lint
        run: |
          ruff check src tests kaggle
          ruff format --check src tests kaggle
      - name: Tests (coverage gate 88%)
        run: pytest -q --cov=lungxray --cov-report=term-missing:skip-covered --cov-fail-under=88
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable --progress-spinner off

  web:
    name: Web (typecheck + lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image (build + smoke test)
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t lungxray-api:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 lungxray-api:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health
      - name: Container vulnerability scan (fails on fixable critical CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lungxray-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
