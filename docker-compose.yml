# Full stack locally: React app on http://localhost:8080, API on http://localhost:8000/docs
services:
  api:
    build: .
    image: lungxray-api:local
    ports: ["8000:8000"]
    environment:
      AUTH_MODE: demo
      STORAGE_MODE: local
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./models/production:/app/models/production:ro
      - lungxray-data:/app/var/storage

  web:
    build: ./web
    image: lungxray-web:local
    depends_on:
      api:
        condition: service_healthy
    ports: ["8080:8080"]

volumes:
  lungxray-data:
